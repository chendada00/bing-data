
name: Backfill Bing History

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "开始日期（YYYY-MM-DD，可留空，默认最近90天）"
        required: false
        type: string
        default: ""

      end_date:
        description: "结束日期（YYYY-MM-DD，可留空，默认数据源最新日期）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: bing-wallpaper-update
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill Bing Historical Data
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install jimp@0.16.1 node-vibrant@3.2.1-alpha.1

      - name: Backfill historical wallpapers
        run: |
          node scripts/backfill-history.js

      - name: Check changes
        run: |
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short

          echo ""
          echo "========================================"
          echo "Changed files"
          echo "========================================"

          git diff --stat

      - name: Commit historical data
        run: |
          set -e
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          echo "========================================"
          echo "Git status before add"
          echo "========================================"
      
          git status --short
      
          # 先将新增和修改的历史数据加入暂存区
          git add data images preview
      
          echo "========================================"
          echo "Git status after add"
          echo "========================================"
      
          git status --short
      
          # 检查暂存区，而不是检查工作区
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
      
          git commit -m "chore: backfill Bing wallpaper history"
      
          # 明确推送当前 Action 所在分支
          git push origin HEAD:${GITHUB_REF_NAME}
