name: Repair Bing Wallpaper History

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check / repair / switch-image-url"
        required: true
        default: "check"
        type: choice
        options:
          - check
          - repair
          - switch-image-url

      year:
        description: "Target year, for example 2026, or all"
        required: true
        default: "2026"

      max_images:
        description: "Maximum records to process. 0 = unlimited"
        required: true
        default: "20"

      force_uhd:
        description: "重新从 Bing 官方地址下载 UHD，并重新生成所有派生数据"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bing-wallpaper-history-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Bing Wallpaper History
    runs-on: ubuntu-latest

    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout bing-data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout bing-uhd
        uses: actions/checkout@v4
        with:
          repository: chendada00/bing-uhd
          token: ${{ secrets.BING_UHD_TOKEN }}
          path: bing-uhd
          fetch-depth: 1

      - name: Load environment
        shell: bash
        run: |
          set -e

          if [ ! -f .env ]; then
            echo "::error::.env file not found"
            exit 1
          fi

          set -a
          source .env
          set +a

          if [ -z "$PREVIEW_BASE_URL" ]; then
            echo "::error::PREVIEW_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$IMAGE_BASE_URL" ]; then
            echo "::error::IMAGE_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$HISTORY_SOURCE_BASE_URL" ]; then
            echo "::error::HISTORY_SOURCE_BASE_URL is not configured"
            exit 1
          fi

          echo "PREVIEW_BASE_URL=$PREVIEW_BASE_URL" >> "$GITHUB_ENV"
          echo "IMAGE_BASE_URL=$IMAGE_BASE_URL" >> "$GITHUB_ENV"
          echo "HISTORY_SOURCE_BASE_URL=$HISTORY_SOURCE_BASE_URL" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          npm init -y
          npm install jimp@0.16.1 node-vibrant@3.2.1-alpha.1

      - name: Run history repair
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          YEAR: ${{ inputs.year }}
          MAX_IMAGES: ${{ inputs.max_images }}
          FORCE_UHD: ${{ inputs.force_uhd }}
          UHD_ROOT: bing-uhd
        run: |
          set -e
      
          echo "Current directory:"
          pwd
      
          echo "Checking bing-uhd:"
          ls -la bing-uhd
          ls -la bing-uhd/images || true
      
          node scripts/repair-history.js

      - name: Commit bing-uhd
        if: inputs.mode == 'repair'
        shell: bash
        run: |
          set -e

          cd bing-uhd

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/

          if git diff --cached --quiet; then
            echo "No UHD changes."
            exit 0
          fi

          git commit -m "chore: repair historical UHD images"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Commit bing-data
        if: inputs.mode == 'repair' || inputs.mode == 'switch-image-url'
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ preview/

          if git diff --cached --quiet; then
            echo "No bing-data changes."
            exit 0
          fi

          if [ "${{ inputs.mode }}" = "switch-image-url" ]; then
            git commit -m "chore: switch historical image URLs to UHD repository"
          else
            git commit -m "chore: repair historical wallpaper data"
          fi

          git push origin HEAD:${GITHUB_REF_NAME}
