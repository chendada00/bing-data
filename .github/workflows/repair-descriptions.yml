name: 修复必应壁纸描述

on:
  workflow_dispatch:
    inputs:
      year:
        description: '要修复的年份；填写 all 表示全部年份'
        required: true
        default: 'all'
        type: string

      start_date:
        description: '开始日期，格式 YYYY-MM-DD；留空表示不限制'
        required: false
        type: string

      end_date:
        description: '结束日期，格式 YYYY-MM-DD；留空表示不限制'
        required: false
        type: string

      limit:
        description: '最多处理多少条记录；0 表示不限制'
        required: true
        default: '0'
        type: string

      force:
        description: '是否强制重新获取所选范围内的所有描述'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bing-description-repair
  cancel-in-progress: false

jobs:
  repair:
    name: 修复壁纸描述
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      YEAR: ${{ inputs.year }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      LIMIT: ${{ inputs.limit }}
      FORCE: ${{ inputs.force }}

    steps:
      - name: 检出 bing-data 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装运行依赖
        run: |
          npm init -y
          npm install jimp@0.16.1 node-vibrant@3.2.1-alpha.1

      - name: 检查输入参数
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$YEAR" != "all" && ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error::年份必须填写 all 或四位数字"
            exit 1
          fi

          if [[ "$LIMIT" != "0" && ! "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::处理条数必须是非负整数"
            exit 1
          fi

          if [[ -n "$START_DATE" && ! "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::开始日期格式必须为 YYYY-MM-DD"
            exit 1
          fi

          if [[ -n "$END_DATE" && ! "$END_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::结束日期格式必须为 YYYY-MM-DD"
            exit 1
          fi

          if [[ -n "$START_DATE" && -n "$END_DATE" && "$START_DATE" > "$END_DATE" ]]; then
            echo "::error::开始日期不能晚于结束日期"
            exit 1
          fi

      - name: 获取并修复壁纸描述
        run: node scripts/repair-descriptions.js

      - name: 提交数据变更
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "没有需要提交的数据变更。"
            exit 0
          fi

          git commit -m "修复必应壁纸描述"
          git push origin HEAD:${GITHUB_REF_NAME}
