
name: Deploy Bing Wallpaper

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "强制重新部署 bing-wallpaper"
        required: false
        default: false
        type: boolean

  push:

permissions:
  contents: read

concurrency:
  group: deploy-bing-wallpaper
  cancel-in-progress: false

jobs:
  deploy:
    name: Detect changes, notify and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout bing-data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze repository changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              FILES="$(git ls-tree -r --name-only "$CURRENT_SHA")"
            else
              FILES="$(git diff --name-only \
                "$BEFORE_SHA" "$CURRENT_SHA")"
            fi
          else
            # 手动运行时展示 HEAD 最近一次提交的文件，
            # 但不会仅因为这些文件属于 data/ 就自动部署。
            FILES="$(git diff-tree \
              --no-commit-id --name-only -r "$CURRENT_SHA")"
          fi

          if [[ -z "$FILES" ]]; then
            DISPLAY_FILES="未检测到文件变更"
            FILE_COUNT=0
          else
            DISPLAY_FILES="$FILES"
            FILE_COUNT="$(printf '%s\n' "$FILES" |
              wc -l | tr -d ' ')"
          fi

          DEPLOY_REQUIRED="false"

          # 只有 push 事件才根据文件路径自动部署。
          if [[ "$EVENT_NAME" == "push" ]]; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                data/*)
                  DEPLOY_REQUIRED="true"
                  break
                  ;;
              esac
            done <<< "$FILES"
          fi

          # 手动运行只有显式选择强制部署才会部署。
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] &&
             [[ "$FORCE_DEPLOY" == "true" ]]; then
            DEPLOY_REQUIRED="true"
          fi

          {
            echo "files<<CHANGE_FILES_EOF"
            printf '%s\n' "$DISPLAY_FILES"
            echo "CHANGE_FILES_EOF"
            echo "file_count=$FILE_COUNT"
            echo "deploy_required=$DEPLOY_REQUIRED"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Repository change summary"
            echo "- Event: $EVENT_NAME"
            echo "- Changed files: $FILE_COUNT"
            echo "- Deployment required: $DEPLOY_REQUIRED"
            echo '```text'
            printf '%s\n' "$DISPLAY_FILES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Changed files: $FILE_COUNT"
          echo "Deployment required: $DEPLOY_REQUIRED"

      - name: Trigger bing-wallpaper deployment
        id: deploy
        if: steps.changes.outputs.deploy_required == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
          TARGET_REPO: chendada00/bing-wallpaper
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_ACTOR: ${{ github.actor }}
          SOURCE_EVENT: ${{ github.event_name }}
          CHANGE_FILES: ${{ steps.changes.outputs.files }}
          FILE_COUNT: ${{ steps.changes.outputs.file_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing DEPLOY_TRIGGER_TOKEN secret"
            exit 1
          fi

          PAYLOAD="$(jq -n \
            --arg event_type "data_updated" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_actor "$SOURCE_ACTOR" \
            --arg source_event "$SOURCE_EVENT" \
            --arg changed_files "$CHANGE_FILES" \
            --arg file_count "$FILE_COUNT" \
            --arg run_url "$RUN_URL" \
            '{
              event_type: $event_type,
              client_payload: {
                source_sha: $source_sha,
                source_actor: $source_actor,
                source_event: $source_event,
                changed_files: $changed_files,
                file_count: $file_count,
                run_url: $run_url
              }
            }')"

          HTTP_CODE="$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -o /tmp/dispatch-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -d "$PAYLOAD")"

          if [[ "$HTTP_CODE" != "204" ]]; then
            echo "::error::repository_dispatch failed: HTTP $HTTP_CODE"
            cat /tmp/dispatch-response.json
            exit 1
          fi

          echo "GitHub accepted the deployment trigger."

      - name: Skip deployment
        if: steps.changes.outputs.deploy_required != 'true'
        run: |
          echo "No deployment-triggering changes detected."
          echo "PushPlus notification will still be sent."

      - name: Send PushPlus notification
        if: always()
        continue-on-error: true
        shell: bash
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_ACTOR: ${{ github.actor }}
          SOURCE_EVENT: ${{ github.event_name }}
          CHANGE_FILES: ${{ steps.changes.outputs.files }}
          FILE_COUNT: ${{ steps.changes.outputs.file_count }}
          DEPLOY_REQUIRED: ${{ steps.changes.outputs.deploy_required }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${PUSHPLUS_TOKEN:-}" ]]; then
            echo "::warning::PUSHPLUS_TOKEN not configured."
            exit 0
          fi

          if [[ "$CHANGES_OUTCOME" != "success" ]]; then
            DEPLOY_STATUS="变更分析失败，请检查工作流日志"
          elif [[ "$DEPLOY_REQUIRED" == "true" ]]; then
            if [[ "$DEPLOY_OUTCOME" == "success" ]]; then
              DEPLOY_STATUS="已成功发送部署触发请求"
            else
              DEPLOY_STATUS="部署触发失败，请检查工作流日志"
            fi
          else
            DEPLOY_STATUS="本次不需要重新部署"
          fi

          CONTENT="$(cat <<EOF
          ## bing-data 仓库更新通知

          - **触发方式：** $SOURCE_EVENT
          - **操作人：** $SOURCE_ACTOR
          - **提交：** \`$SOURCE_SHA\`
          - **变更文件数：** ${FILE_COUNT:-0}
          - **部署状态：** $DEPLOY_STATUS

          ### 本次变更文件

          \`\`\`text
          ${CHANGE_FILES:-未获取到文件列表}
          \`\`\`

          [查看 GitHub Actions 运行日志]($RUN_URL)

          > 部署触发请求成功不代表网站构建和发布已经完成。
          EOF
          )"

          BODY="$(jq -n \
            --arg token "$PUSHPLUS_TOKEN" \
            --arg title "bing-data 仓库更新通知" \
            --arg content "$CONTENT" \
            '{
              token: $token,
              title: $title,
              content: $content,
              template: "markdown"
            }')"

          HTTP_CODE="$(curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -o /tmp/pushplus-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            "https://www.pushplus.plus/send" \
            -d "$BODY")"

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::warning::PushPlus HTTP error: $HTTP_CODE"
            cat /tmp/pushplus-response.json
            exit 1
          fi

          if ! jq -e '.code == 200' \
            /tmp/pushplus-response.json >/dev/null; then
            echo "::warning::PushPlus API returned an unexpected response."
            cat /tmp/pushplus-response.json
            exit 1
          fi

          echo "PushPlus notification accepted."
