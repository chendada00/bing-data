name: Backfill Historical AI Stories

on:
  # 每天北京时间 02:00 自动补充；GitHub Actions cron 使用 UTC。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '开始日期 YYYY-MM-DD；留空表示不限制'
        required: false
        default: ''
        type: string
      end_date:
        description: '结束日期 YYYY-MM-DD；留空表示不限制'
        required: false
        default: ''
        type: string
      force:
        description: '强制重新生成已有 AI 解读（会覆盖旧解读）'
        required: false
        default: false
        type: boolean
      max_items:
        description: '本次最多成功补充条数（1-5）；留空默认 5'
        required: false
        default: '5'
        type: string

permissions:
  contents: write

concurrency:
  group: bing-ai-story-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: 补充历史壁纸 AI 解读
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      START_DATE: ${{ github.event.inputs.start_date || '' }}
      END_DATE: ${{ github.event.inputs.end_date || '' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
      MAX_ITEMS: ${{ github.event.inputs.max_items || '5' }}

      # 与每日 update-bing.yml 完全复用同一组 AI Secrets / Variables。
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.chatanywhere.org/v1' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4o' }}

    steps:
      - name: 检出 bing-data 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验输入与 AI 配置
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${AI_API_KEY:-}" ]]; then
            echo "::error::请在仓库 Secrets 中配置 AI_API_KEY（与每日更新壁纸任务使用同一个 Key）"
            exit 1
          fi

          if [[ ! "$MAX_ITEMS" =~ ^[0-9]+$ ]] || (( MAX_ITEMS < 1 || MAX_ITEMS > 5 )); then
            echo "::error::MAX_ITEMS 必须是 1 到 5 之间的整数"
            exit 1
          fi

          validate_date() {
            local value="$1"
            local name="$2"
            [[ -z "$value" ]] && return 0
            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::$name 必须使用 YYYY-MM-DD 格式"
              exit 1
            fi
            local parsed
            parsed="$(date -u -d "$value" +%F 2>/dev/null)" || {
              echo "::error::$name 不是有效日期：$value"
              exit 1
            }
            if [[ "$parsed" != "$value" ]]; then
              echo "::error::$name 不是有效日期：$value"
              exit 1
            fi
          }

          validate_date "$START_DATE" "start_date"
          validate_date "$END_DATE" "end_date"

          if [[ -n "$START_DATE" && -n "$END_DATE" && "$START_DATE" > "$END_DATE" ]]; then
            echo "::error::start_date 不能晚于 end_date"
            exit 1
          fi

          echo "输入校验通过。"
          echo "日期范围：${START_DATE:-不限} 至 ${END_DATE:-不限}"
          echo "强制重生成：${FORCE:-false}"
          echo "最多成功补充：$MAX_ITEMS 条"
          echo "AI_BASE_URL：${AI_BASE_URL}"
          echo "AI_MODEL：${AI_MODEL}"

      - name: 安装依赖
        run: |
          npm init -y
          npm install --no-save jimp@0.16.1 openai

      - name: 检查脚本语法
        run: |
          node --check scripts/ai-story.js
          node --check scripts/backfill-ai-stories.js

      - name: 补充历史 AI 解读
        run: node scripts/backfill-ai-stories.js

      - name: 提交历史 AI 解读数据
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data/
          if git diff --cached --quiet; then
            echo "没有新增 AI 解读数据，无需提交。"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: backfill historical AI wallpaper stories"
          git push origin "HEAD:${GITHUB_REF_NAME}"
