name: Update Bing Wallpaper

on:
  # 手动执行
  workflow_dispatch:

  # 每天执行 3 次
  #
  # GitHub Actions 使用 UTC
  #
  # 北京时间 08:00 = UTC 00:00
  # 北京时间 16:00 = UTC 08:00
  # 北京时间 23:00 = UTC 15:00
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 15 * * *"

# 允许 Action 提交文件
permissions:
  contents: write

# 防止同一时间多个任务同时修改仓库
concurrency:
  group: bing-wallpaper-update
  cancel-in-progress: false

jobs:

  update:
    name: Download Bing Wallpaper

    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load environment
        run: |
          if [ ! -f .env ]; then
            echo "::error::.env file not found"
            exit 1
          fi

          set -a
          source .env
          set +a

          if [ -z "$ASSET_BASE_URL" ]; then
            echo "::error::ASSET_BASE_URL is not configured"
            exit 1
          fi

          echo "ASSET_BASE_URL=$ASSET_BASE_URL" >> "$GITHUB_ENV"

          echo "Asset base URL: $ASSET_BASE_URL"
      # ============================================================
      # 2. Node.js
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. 安装图片处理依赖
      #
      # 使用与原项目一致的版本。
      #
      # node-vibrant 新版本使用 ES Module，
      # 原来的 require("node-vibrant") 会报：
      #
      # There is no default export in this module
      #
      # 所以这里固定旧版本。
      # ============================================================

      - name: Install dependencies
        run: |
          npm init -y
          npm install jimp@0.16.1 node-vibrant@3.2.1-alpha.1


      # ============================================================
      # 4. 获取并处理 Bing 壁纸
      # ============================================================

      - name: Download and process Bing wallpaper
        run: |

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");
          const https = require("https");
          const http = require("http");

          const Jimp = require("jimp");
          const Vibrant = require("node-vibrant");

          const ASSET_BASE_URL = (
            process.env.ASSET_BASE_URL || ""
          ).replace(/\/$/, "");

          if (!ASSET_BASE_URL) {
            throw new Error(
              "ASSET_BASE_URL is not configured"
            );
          }

          function buildAssetUrl(filePath) {
            return (
              ASSET_BASE_URL +
              "/" +
              filePath
                .replace(/\\/g, "/")
                .replace(/^\/+/, "")
            );
          }
          // ========================================================
          // 基础工具
          // ========================================================

          function log(message) {
            console.log(
              `[${new Date().toISOString()}] ${message}`
            );
          }


          function sleep(ms) {
            return new Promise(resolve => {
              setTimeout(resolve, ms);
            });
          }


          // ========================================================
          // HTTP 请求
          // ========================================================

          function requestBuffer(url, retry = 0) {

            return new Promise((resolve, reject) => {

              if (retry > 3) {
                reject(
                  new Error(
                    `Request failed after 3 retries: ${url}`
                  )
                );

                return;
              }


              const client =
                url.startsWith("https://")
                  ? https
                  : http;


              const request =
                client.get(
                  url,
                  {
                    headers: {
                      "User-Agent":
                        "Mozilla/5.0 " +
                        "(Windows NT 10.0; Win64; x64) " +
                        "AppleWebKit/537.36 " +
                        "Chrome/140 Safari/537.36",

                      "Accept":
                        "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
                    }
                  },

                  response => {

                    // ------------------------------------------------
                    // HTTP 重定向
                    // ------------------------------------------------

                    if (
                      response.statusCode >= 300 &&
                      response.statusCode < 400 &&
                      response.headers.location
                    ) {

                      response.resume();

                      const redirectUrl =
                        new URL(
                          response.headers.location,
                          url
                        ).toString();


                      requestBuffer(
                        redirectUrl,
                        retry
                      )
                        .then(resolve)
                        .catch(reject);

                      return;
                    }


                    // ------------------------------------------------
                    // HTTP 错误
                    // ------------------------------------------------

                    if (
                      response.statusCode !== 200
                    ) {

                      response.resume();

                      reject(
                        new Error(
                          `HTTP ${response.statusCode}: ${url}`
                        )
                      );

                      return;
                    }


                    const chunks = [];


                    response.on(
                      "data",
                      chunk => {
                        chunks.push(chunk);
                      }
                    );


                    response.on(
                      "end",
                      () => {

                        resolve(
                          Buffer.concat(chunks)
                        );

                      }
                    );


                    response.on(
                      "error",
                      reject
                    );

                  }
                );


              request.setTimeout(
                30000,
                () => {

                  request.destroy(
                    new Error(
                      `Request timeout: ${url}`
                    )
                  );

                }
              );


              request.on(
                "error",
                error => {

                  if (retry < 3) {

                    log(
                      `Request failed, retry ${retry + 1}/3`
                    );


                    sleep(
                      2000 * (retry + 1)
                    )
                      .then(() => {

                        requestBuffer(
                          url,
                          retry + 1
                        )
                          .then(resolve)
                          .catch(reject);

                      });

                  } else {

                    reject(error);

                  }

                }
              );

            });

          }


          // ========================================================
          // 下载图片
          // ========================================================

          async function downloadImage(url) {

            log(
              `Downloading image: ${url}`
            );


            const buffer =
              await requestBuffer(url);


            // 基本完整性检查
            if (
              !buffer ||
              buffer.length < 50 * 1024
            ) {

              throw new Error(
                `Image is too small: ${buffer.length} bytes`
              );

            }


            return buffer;
          }


          // ========================================================
          // RGB → HEX
          // ========================================================

          function componentToHex(num) {

            const hex =
              Math.round(num)
                .toString(16);


            return hex.length === 1
              ? "0" + hex
              : hex;
          }


          function rgbToHex(rgb) {

            return (
              "#" +
              componentToHex(rgb[0]) +
              componentToHex(rgb[1]) +
              componentToHex(rgb[2])
            );

          }


          // ========================================================
          // 获取主色调
          // ========================================================

          async function getMainColors(imageBuffer) {

            log(
              "Analyzing image colors..."
            );


            const image =
              await Jimp.read(
                imageBuffer
              );


            const tempFile =
              path.join(
                process.env.RUNNER_TEMP ||
                  "/tmp",
                "bing-color.jpg"
              );


            await image.writeAsync(
              tempFile
            );


            const palette =
              await new Promise(
                (resolve, reject) => {

                  Vibrant.from(
                    tempFile
                  ).getPalette(
                    (error, result) => {

                      if (error) {
                        reject(error);
                        return;
                      }

                      resolve(result);

                    }
                  );

                }
              );


            const colors = {};


            Object.keys(
              palette || {}
            ).forEach(
              key => {

                const swatch =
                  palette[key];


                if (
                  swatch &&
                  swatch.rgb
                ) {

                  colors[key] =
                    rgbToHex(
                      swatch.rgb
                    );

                }

              }
            );


            return colors;
          }


          // ========================================================
          // 生成极小 Base64
          //
          // 用于前端模糊占位。
          //
          // 保持原项目逻辑：
          // resize(16, 9)
          // quality(90)
          // ========================================================

          async function getBase64(
            imageBuffer
          ) {

            log(
              "Generating Base64 thumbnail..."
            );


            const image =
              await Jimp.read(
                imageBuffer
              );


            image
              .resize(
                16,
                9
              )
              .quality(
                90
              );


            const base64 =
              await image.getBase64Async(
                Jimp.MIME_JPEG
              );


            return base64;
          }


          // ========================================================
          // 生成 Preview
          //
          // 首页/历史列表使用。
          //
          // 目标：
          // 1600 × 900
          // JPEG
          // 尽量控制在 800KB 以下
          //
          // 如果 1600×900 仍然较大，会降低质量。
          // 如果质量降到 70 仍然超过目标，
          // 则进一步缩小到 1280×720。
          // ========================================================

          async function generatePreview(
            imageBuffer,
            previewFile
          ) {

            log(
              "Generating preview image..."
            );


            const source =
              await Jimp.read(
                imageBuffer
              );


            const targetSize =
              800 * 1024;


            // ------------------------------------------------------
            // 第一阶段：1600 × 900
            // ------------------------------------------------------

            const qualities = [
              82,
              78,
              75,
              72,
              70
            ];


            for (
              const quality of qualities
            ) {

              const image =
                source.clone();


              image
                .resize(
                  1600,
                  900
                )
                .quality(
                  quality
                );


              const buffer =
                await image.getBufferAsync(
                  Jimp.MIME_JPEG
                );


              log(
                `Preview attempt: 1600x900, quality=${quality}, size=${Math.round(buffer.length / 1024)}KB`
              );


              if (
                buffer.length <= targetSize ||
                quality === 70
              ) {

                fs.mkdirSync(
                  path.dirname(previewFile),
                  {
                    recursive: true
                  }
                );


                fs.writeFileSync(
                  previewFile,
                  buffer
                );


                return {
                  width: 1600,
                  height: 900,
                  quality,
                  size: buffer.length
                };

              }

            }


            // ------------------------------------------------------
            // 第二阶段：1280 × 720
            //
            // 理论上上面的循环已经会 return，
            // 这里只是额外保险。
            // ------------------------------------------------------

            const fallbackQualities = [
              78,
              75,
              72,
              70
            ];


            for (
              const quality of fallbackQualities
            ) {

              const image =
                source.clone();


              image
                .resize(
                  1280,
                  720
                )
                .quality(
                  quality
                );


              const buffer =
                await image.getBufferAsync(
                  Jimp.MIME_JPEG
                );


              log(
                `Preview fallback: 1280x720, quality=${quality}, size=${Math.round(buffer.length / 1024)}KB`
              );


              if (
                buffer.length <= targetSize ||
                quality === 70
              ) {

                fs.mkdirSync(
                  path.dirname(previewFile),
                  {
                    recursive: true
                  }
                );


                fs.writeFileSync(
                  previewFile,
                  buffer
                );


                return {
                  width: 1280,
                  height: 720,
                  quality,
                  size: buffer.length
                };

              }

            }

          }


          // ========================================================
          // 获取当前日期
          //
          // 强制使用 Asia/Shanghai
          // ========================================================

          function getDate() {

            const formatter =
              new Intl.DateTimeFormat(
                "en-CA",
                {
                  timeZone:
                    "Asia/Shanghai",

                  year:
                    "numeric",

                  month:
                    "2-digit",

                  day:
                    "2-digit"
                }
              );


            return formatter.format(
              new Date()
            );

          }


          // ========================================================
          // 主程序
          // ========================================================

          async function main() {

            const date =
              getDate();


            const [
              year,
              month,
              day
            ] =
              date.split("-");


            const yearDir =
              path.join(
                "data",
                year
              );


            const jsonFile =
              path.join(
                yearDir,
                `${month}.json`
              );


            // ------------------------------------------------------
            // 原图目录
            // ------------------------------------------------------

            const imageDir =
              path.join(
                "images",
                year,
                month
              );


            const imageFile =
              path.join(
                imageDir,
                `${date}.jpg`
              );


            // ------------------------------------------------------
            // Preview 目录
            // ------------------------------------------------------

            const previewDir =
              path.join(
                "preview",
                year,
                month
              );


            const previewFile =
              path.join(
                previewDir,
                `${date}.jpg`
              );


            log(
              "========================================"
            );


            log(
              `Today: ${date}`
            );


            log(
              `JSON: ${jsonFile}`
            );


            log(
              `Original: ${imageFile}`
            );


            log(
              `Preview: ${previewFile}`
            );


            log(
              "========================================"
            );


            // =====================================================
            // 1. 读取已有 JSON
            // =====================================================

            let monthData = {
              version: 1,

              year:
                Number(year),

              month:
                Number(month),

              updatedAt:
                null,

              items: []
            };


            if (
              fs.existsSync(
                jsonFile
              )
            ) {

              try {

                monthData =
                  JSON.parse(
                    fs.readFileSync(
                      jsonFile,
                      "utf8"
                    )
                  );


                if (
                  !Array.isArray(
                    monthData.items
                  )
                ) {

                  monthData.items = [];

                }

              } catch (error) {

                log(
                  "Existing JSON is invalid, rebuilding."
                );

              }

            }


            // =====================================================
            // 2. 查找今天已有数据
            // =====================================================

            const existing =
              monthData.items.find(
                item =>
                  item.date === date
              );


            const imageExists =
              fs.existsSync(
                imageFile
              );


            const previewExists =
              fs.existsSync(
                previewFile
              );


            // =====================================================
            // 3. 如果所有数据都已经完整，直接结束
            // =====================================================

            const isComplete =
              imageExists &&
              previewExists &&
              existing &&
              existing.title &&
              existing.description &&
              existing.base64 &&
              existing.color &&
              existing.image &&
              existing.preview;


            if (isComplete) {

              log(
                "Today's wallpaper is already complete."
              );


              log(
                "No update required."
              );


              return;

            }


            log(
              "Today's data is missing or incomplete."
            );


            // =====================================================
            // 4. 准备图片数据
            //
            // 非常重要：
            //
            // 如果原图已经存在：
            //     直接读取本地原图
            //
            // 不重新下载。
            // 不覆盖原图。
            //
            // 只有原图不存在时才从 Bing 下载。
            // =====================================================

            let imageBuffer;
            let actualImageUrl = null;
            let bing = null;


            if (imageExists) {

              log(
                "Original image already exists."
              );


              log(
                "Reading existing original image..."
              );


              imageBuffer =
                fs.readFileSync(
                  imageFile
                );


              // 如果 JSON 已经记录过源地址，
              // 保留原来的地址。
              if (
                existing &&
                existing.sourceImage
              ) {

                actualImageUrl =
                  existing.sourceImage;

              }


              log(
                `Existing original image size: ${Math.round(imageBuffer.length / 1024)}KB`
              );


            } else {

              // ===================================================
              // 5. 获取 Bing 官方 JSON
              // ===================================================

              const apiUrl =
                "https://cn.bing.com/" +
                "HPImageArchive.aspx" +
                "?format=js" +
                "&idx=0" +
                "&n=1" +
                "&mkt=zh-CN";


              log(
                `Requesting Bing API: ${apiUrl}`
              );


              const apiBuffer =
                await requestBuffer(
                  apiUrl
                );


              const bingJson =
                JSON.parse(
                  apiBuffer.toString(
                    "utf8"
                  )
                );


              if (
                !bingJson.images ||
                !bingJson.images[0]
              ) {

                throw new Error(
                  "Bing API returned no image."
                );

              }


              bing =
                bingJson.images[0];


              log(
                `Bing title: ${bing.title || ""}`
              );


              log(
                `Bing copyright: ${bing.copyright || ""}`
              );


              // ===================================================
              // 6. 生成图片 URL
              // ===================================================

              const defaultImageUrl =
                new URL(
                  bing.url,
                  "https://cn.bing.com"
                ).toString();


              let uhdImageUrl = null;


              if (
                bing.urlbase
              ) {

                uhdImageUrl =
                  "https://cn.bing.com" +
                  bing.urlbase +
                  "_UHD.jpg";

              }


              log(
                `UHD URL: ${uhdImageUrl || "N/A"}`
              );


              // ===================================================
              // 7. 优先下载 UHD
              // ===================================================

              try {

                if (
                  !uhdImageUrl
                ) {

                  throw new Error(
                    "Bing API does not provide urlbase."
                  );

                }


                imageBuffer =
                  await downloadImage(
                    uhdImageUrl
                  );


                actualImageUrl =
                  uhdImageUrl;


                log(
                  "UHD image downloaded successfully."
                );


              } catch (error) {

                log(
                  `UHD download failed: ${error.message}`
                );


                log(
                  "Falling back to Bing default image..."
                );


                imageBuffer =
                  await downloadImage(
                    defaultImageUrl
                  );


                actualImageUrl =
                  defaultImageUrl;


                log(
                  "Default image downloaded successfully."
                );

              }


              // ===================================================
              // 8. 保存原图
              //
              // 只在原图不存在的时候写入。
              // ===================================================

              fs.mkdirSync(
                imageDir,
                {
                  recursive: true
                }
              );


              fs.writeFileSync(
                imageFile,
                imageBuffer
              );


              log(
                `Original image saved: ${imageFile}`
              );


              // 释放 bing API 对象供后面使用

            }


            // =====================================================
            // 9. 如果没有 Bing API 数据，但是已有 JSON 数据
            // =====================================================
            //
            // 这种情况主要用于：
            //
            // 已经存在原图
            // 但 preview 缺失
            //
            // 此时完全不需要再次访问 Bing。
            // =====================================================

            if (
              !bing &&
              existing
            ) {

              bing = {
                title:
                  existing.title,

                copyright:
                  existing.copyright ||
                  existing.description,

                copyrightlink:
                  existing.copyrightLink,

                url:
                  null,

                urlbase:
                  null
              };

            }


            // =====================================================
            // 10. 获取图片尺寸
            // =====================================================

            const image =
              await Jimp.read(
                imageBuffer
              );


            const width =
              image.bitmap.width;


            const height =
              image.bitmap.height;


            log(
              `Image size: ${width}x${height}`
            );


            // =====================================================
            // 11. 生成 Base64
            //
            // 如果原来的 Base64 已经存在，
            // 可以继续使用，避免重复编码。
            // =====================================================

            let base64;


            if (
              existing &&
              existing.base64
            ) {

              base64 =
                existing.base64;


              log(
                "Using existing Base64 thumbnail."
              );

            } else {

              base64 =
                await getBase64(
                  imageBuffer
                );

            }


            // =====================================================
            // 12. 获取颜色
            //
            // 如果已经有颜色数据，
            // 直接复用。
            // =====================================================

            let colors;


            if (
              existing &&
              existing.color
            ) {

              colors =
                existing.color;


              log(
                "Using existing color palette."
              );

            } else {

              colors =
                await getMainColors(
                  imageBuffer
                );

            }


            // =====================================================
            // 13. 生成 Preview
            //
            // 如果已经存在 preview：
            //     不重新生成。
            //
            // 如果不存在：
            //     从本地原图生成。
            // =====================================================

            let previewInfo = null;


            if (
              previewExists
            ) {

              log(
                "Preview image already exists."
              );


            } else {

              previewInfo =
                await generatePreview(
                  imageBuffer,
                  previewFile
                );


              log(
                `Preview generated: ${Math.round(previewInfo.size / 1024)}KB`
              );

            }


            // =====================================================
            // 14. 获取最终 URL
            // =====================================================

            const imageUrl =
              `https://raw.githubusercontent.com/chendada00/bing-data/main/images/${year}/${month}/${date}.jpg`;


            const previewUrl =
              `https://raw.githubusercontent.com/chendada00/bing-data/main/preview/${year}/${month}/${date}.jpg`;


            // =====================================================
            // 15. 生成当天 JSON 数据
            // =====================================================

            const item = {

              date,

              title:
                bing.title ||
                (existing && existing.title) ||
                "",

              // Bing 当前 API 如果只返回一段描述，
              // 就直接保存这一段。
              description:
                bing.copyright ||
                (existing && existing.description) ||
                "",

              copyright:
                bing.copyright ||
                (existing && existing.copyright) ||
                "",

              copyrightLink:
                bing.copyrightlink ||
                (existing && existing.copyrightLink) ||
                null,

              // 原始 UHD 图
              image:
                imageUrl,

              // 首页/历史列表展示图
              preview:
                previewUrl,

              // Bing 原始图片地址
              sourceImage:
                actualImageUrl ||
                (existing && existing.sourceImage) ||
                null,

              // 极小 Base64，占位使用
              base64,

              // 主色
              color:
                colors,

              width,

              height,

              // 保留 Bing 的一些日期信息
              id:
                bing.hsh ||
                (existing && existing.id) ||
                null,

              startDate:
                bing.startdate ||
                (existing && existing.startDate) ||
                null,

              fullStartDate:
                bing.fullstartdate ||
                (existing && existing.fullStartDate) ||
                null,

              endDate:
                bing.enddate ||
                (existing && existing.endDate) ||
                null

            };


            // =====================================================
            // 16. 更新月 JSON
            // =====================================================

            const existingIndex =
              monthData.items.findIndex(
                item =>
                  item.date === date
              );


            if (
              existingIndex >= 0
            ) {

              monthData.items[
                existingIndex
              ] = item;

            } else {

              monthData.items.push(
                item
              );

            }


            // -----------------------------------------------------
            // 按日期排序
            // -----------------------------------------------------

            monthData.items.sort(
              (a, b) =>
                a.date.localeCompare(
                  b.date
                )
            );


            monthData.updatedAt =
              new Date().toISOString();


            // =====================================================
            // 17. 保存 JSON
            // =====================================================

            fs.mkdirSync(
              yearDir,
              {
                recursive: true
              }
            );


            fs.writeFileSync(
              jsonFile,
              JSON.stringify(
                monthData,
                null,
                2
              ) + "\n",
              "utf8"
            );


            // =====================================================
            // 18. 输出最终结果
            // =====================================================

            log(
              "========================================"
            );


            log(
              "Bing wallpaper update completed."
            );


            log(
              `Date: ${date}`
            );


            log(
              `Original: ${imageFile}`
            );


            log(
              `Preview: ${previewFile}`
            );


            log(
              `JSON: ${jsonFile}`
            );


            log(
              `Original URL: ${imageUrl}`
            );


            log(
              `Preview URL: ${previewUrl}`
            );


            log(
              `Image size: ${width}x${height}`
            );


            log(
              `Original file size: ${Math.round(imageBuffer.length / 1024)}KB`
            );


            log(
              "========================================"

            );

          }


          // ========================================================
          // 执行
          // ========================================================

          main()
            .catch(error => {

              console.error(
