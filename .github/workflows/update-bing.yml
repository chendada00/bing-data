name: Update Bing Wallpaper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *" # 北京时间 00:00 (UTC 16:00)
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: bing-wallpaper-update
  cancel-in-progress: false

jobs:
  update:
    name: Download Bing Wallpaper
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      # =========================================================
      # 1. Checkout bing-data
      # =========================================================
      - name: Checkout bing-data
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =========================================================
      # 2. Checkout bing-uhd
      # =========================================================
      - name: Checkout bing-uhd
        uses: actions/checkout@v4
        with:
          repository: chendada00/bing-uhd
          token: ${{ secrets.BING_UHD_TOKEN }}
          path: bing-uhd
          fetch-depth: 1

      # =========================================================
      # 3. Load environment
      # =========================================================
      - name: Load environment
        run: |
          set -e

          if [ ! -f .env ]; then
            echo "::error::.env file not found"
            exit 1
          fi

          set -a
          source .env
          set +a

          if [ -z "$PREVIEW_BASE_URL" ]; then
            echo "::error::PREVIEW_BASE_URL is not configured"
            exit 1
          fi

          if [ -z "$IMAGE_BASE_URL" ]; then
            echo "::error::IMAGE_BASE_URL is not configured"
            exit 1
          fi

          echo "PREVIEW_BASE_URL=$PREVIEW_BASE_URL" >> "$GITHUB_ENV"
          echo "IMAGE_BASE_URL=$IMAGE_BASE_URL" >> "$GITHUB_ENV"

      # =========================================================
      # 4. Setup Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # =========================================================
      # 5. Install dependencies
      # =========================================================
      - name: Install dependencies
        run: |
          npm init -y
          npm install jimp@0.16.1 node-vibrant@3.2.1-alpha.1

      # =========================================================
      # 6. Download and process Bing wallpaper
      # =========================================================
      - name: Download and process Bing wallpaper
        run: |
          node scripts/update-bing.js

      # =========================================================
      # 7. Commit and push bing-uhd
      # =========================================================
      - name: Commit and push bing-uhd
        working-directory: bing-uhd
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/

          if git diff --cached --quiet; then
            echo "No bing-uhd changes to commit."
            exit 0
          fi

          git commit -m "Update Bing UHD wallpaper"

          git push origin HEAD:main

      # =========================================================
      # 8. Commit and push bing-data
      # =========================================================
      - name: Commit and push bing-data
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ preview/

          if git diff --cached --quiet; then
            echo "No bing-data changes to commit."
            exit 0
          fi

          git commit -m "Update Bing wallpaper"

          git push origin HEAD:${GITHUB_REF_NAME}
