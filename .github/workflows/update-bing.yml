name: Update Bing Wallpaper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 15 * * *"

permissions:
  contents: write

concurrency:
  group: bing-wallpaper-update
  cancel-in-progress: false

jobs:
  update:
    name: Download Bing Wallpaper
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load environment
        run: |
          set -e
          if [ ! -f .env ]; then
            echo "::error::.env file not found"
            exit 1
          fi

          set -a
          source .env
          set +a

          if [ -z "$ASSET_BASE_URL" ]; then
            echo "::error::ASSET_BASE_URL is not configured"
            exit 1
          fi

          echo "ASSET_BASE_URL=$ASSET_BASE_URL" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install jimp@0.16.1 node-vibrant@3.2.1-alpha.1

      - name: Download and process Bing wallpaper
        run: node scripts/update-bing.js

      - name: Commit and push changes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ images/ preview/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Bing wallpaper"
          git push origin HEAD:${GITHUB_REF_NAME}
