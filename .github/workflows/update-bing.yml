name: Update Bing Wallpaper

on:
  # 手动执行
  workflow_dispatch:

  # 每天执行 3 次
  #
  # GitHub Actions 使用 UTC
  #
  # 北京时间 08:00 = UTC 00:00
  # 北京时间 16:00 = UTC 08:00
  # 北京时间 23:00 = UTC 15:00
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 15 * * *"

# 允许 Action 提交文件
permissions:
  contents: write

# 防止同一时间多个任务同时修改仓库
concurrency:
  group: bing-wallpaper-update
  cancel-in-progress: false

jobs:

  update:
    name: Download Bing Wallpaper

    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. Node.js
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. 安装图片处理依赖
      #
      # 使用与你原项目一致的：
      #
      # Jimp
      # node-vibrant
      #
      # 原项目也是使用这两个库处理 Base64 和主色。
      # ============================================================

      - name: Install dependencies
        run: |
          npm init -y
          npm install jimp node-vibrant


      # ============================================================
      # 4. 获取并保存 Bing 壁纸
      # ============================================================

      - name: Download and process Bing wallpaper
        run: |

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");
          const https = require("https");
          const http = require("http");

          const Jimp = require("jimp");
          const Vibrant = require("node-vibrant");


          // ========================================================
          // 基础工具
          // ========================================================

          function log(message) {
            console.log(
              `[${new Date().toISOString()}] ${message}`
            );
          }


          function sleep(ms) {
            return new Promise(resolve => {
              setTimeout(resolve, ms);
            });
          }


          // ========================================================
          // HTTP 请求
          // ========================================================

          function requestBuffer(url, retry = 0) {

            return new Promise((resolve, reject) => {

              if (retry > 3) {
                reject(
                  new Error(
                    `Request failed after 3 retries: ${url}`
                  )
                );

                return;
              }


              const client =
                url.startsWith("https://")
                  ? https
                  : http;


              const request =
                client.get(
                  url,
                  {
                    headers: {
                      "User-Agent":
                        "Mozilla/5.0 " +
                        "(Windows NT 10.0; Win64; x64) " +
                        "AppleWebKit/537.36 " +
                        "Chrome/140 Safari/537.36",
                      "Accept":
                        "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
                    }
                  },

                  response => {

                    // -----------------------------
                    // HTTP 重定向
                    // -----------------------------

                    if (
                      response.statusCode >= 300 &&
                      response.statusCode < 400 &&
                      response.headers.location
                    ) {

                      response.resume();

                      const redirectUrl =
                        new URL(
                          response.headers.location,
                          url
                        ).toString();


                      requestBuffer(
                        redirectUrl,
                        retry
                      )
                        .then(resolve)
                        .catch(reject);


                      return;
                    }


                    // -----------------------------
                    // HTTP 错误
                    // -----------------------------

                    if (
                      response.statusCode !== 200
                    ) {

                      response.resume();

                      reject(
                        new Error(
                          `HTTP ${response.statusCode}: ${url}`
                        )
                      );

                      return;
                    }


                    const chunks = [];


                    response.on(
                      "data",
                      chunk => {
                        chunks.push(chunk);
                      }
                    );


                    response.on(
                      "end",
                      () => {

                        resolve(
                          Buffer.concat(chunks)
                        );

                      }
                    );


                    response.on(
                      "error",
                      reject
                    );

                  }
                );


              request.setTimeout(
                30000,
                () => {

                  request.destroy(
                    new Error(
                      `Request timeout: ${url}`
                    )
                  );

                }
              );


              request.on(
                "error",
                error => {

                  if (retry < 3) {

                    log(
                      `Request failed, retry ${retry + 1}/3`
                    );


                    sleep(
                      2000 * (retry + 1)
                    )
                      .then(() => {

                        requestBuffer(
                          url,
                          retry + 1
                        )
                          .then(resolve)
                          .catch(reject);

                      });

                  } else {

                    reject(error);

                  }

                }
              );

            });

          }


          // ========================================================
          // 下载图片
          // ========================================================

          async function downloadImage(url) {

            log(
              `Downloading image: ${url}`
            );


            const buffer =
              await requestBuffer(url);


            // 基本完整性检查
            if (
              !buffer ||
              buffer.length < 50 * 1024
            ) {

              throw new Error(
                `Image is too small: ${buffer.length} bytes`
              );

            }


            return buffer;
          }


          // ========================================================
          // RGB → HEX
          //
          // 和原项目保持一致
          // ========================================================

          function componentToHex(num) {

            const hex =
              Math.round(num)
                .toString(16);


            return hex.length === 1
              ? "0" + hex
              : hex;
          }


          function rgbToHex(rgb) {

            return (
              "#" +
              componentToHex(rgb[0]) +
              componentToHex(rgb[1]) +
              componentToHex(rgb[2])
            );

          }


          // ========================================================
          // 获取主色调
          //
          // 这里直接复用原项目 node-vibrant 的思路。
          //
          // 原项目：
          //
          // Vibrant.from(image)
          //   .getPalette(...)
          //
          // 然后把所有 palette 转成 HEX。
          // ========================================================

          async function getMainColors(imageBuffer) {

            log(
              "Analyzing image colors..."
            );


            const image =
              await Jimp.read(
                imageBuffer
              );


            const tempFile =
              path.join(
                process.env.RUNNER_TEMP ||
                  "/tmp",
                "bing-color.jpg"
              );


            await image.writeAsync(
              tempFile
            );


            const palette =
              await new Promise(
                (resolve, reject) => {

                  Vibrant.from(
                    tempFile
                  ).getPalette(
                    (error, result) => {

                      if (error) {
                        reject(error);
                        return;
                      }

                      resolve(result);

                    }
                  );

                }
              );


            const colors = {};


            Object.keys(
              palette || {}
            ).forEach(
              key => {

                const swatch =
                  palette[key];


                if (
                  swatch &&
                  swatch.rgb
                ) {

                  colors[key] =
                    rgbToHex(
                      swatch.rgb
                    );

                }

              }
            );


            return colors;
          }


          // ========================================================
          // 生成 Base64
          //
          // 完全参考原项目：
          //
          // resize(16, 9)
          // quality(90)
          // getBase64(...)
          // ========================================================

          async function getBase64(
            imageBuffer
          ) {

            log(
              "Generating Base64 thumbnail..."
            );


            const image =
              await Jimp.read(
                imageBuffer
              );


            image
              .resize(
                16,
                9
              )
              .quality(
                90
              );


            const base64 =
              await image.getBase64Async(
                Jimp.MIME_JPEG
              );


            return base64;
          }


          // ========================================================
          // 获取当前日期
          //
          // 强制使用 Asia/Shanghai
          // ========================================================

          function getDate() {

            const formatter =
              new Intl.DateTimeFormat(
                "en-CA",
                {
                  timeZone:
                    "Asia/Shanghai",

                  year:
                    "numeric",

                  month:
                    "2-digit",

                  day:
                    "2-digit"
                }
              );


            return formatter.format(
              new Date()
            );

          }


          // ========================================================
          // 主程序
          // ========================================================

          async function main() {

            const date =
              getDate();


            const [
              year,
              month,
              day
            ] =
              date.split("-");


            const yearDir =
              path.join(
                "data",
                year
              );


            const jsonFile =
              path.join(
                yearDir,
                `${month}.json`
              );


            const imageDir =
              path.join(
                "images",
                year,
                month
              );


            const imageFile =
              path.join(
                imageDir,
                `${date}.jpg`
              );


            log(
              "========================================"
            );


            log(
              `Today: ${date}`
            );


            log(
              `JSON: ${jsonFile}`
            );


            log(
              `Image: ${imageFile}`
            );


            log(
              "========================================"
            );


            // =====================================================
            // 1. 读取已有 JSON
            // =====================================================

            let monthData = {
              version: 1,

              year:
                Number(year),

              month:
                Number(month),

              updatedAt:
                null,

              items: []
            };


            if (
              fs.existsSync(
                jsonFile
              )
            ) {

              try {

                monthData =
                  JSON.parse(
                    fs.readFileSync(
                      jsonFile,
                      "utf8"
                    )
                  );


                if (
                  !Array.isArray(
                    monthData.items
                  )
                ) {

                  monthData.items = [];

                }

              } catch (error) {

                log(
                  "Existing JSON is invalid, rebuilding."
                );

              }

            }


            // =====================================================
            // 2. 检查今天是否已经完整
            // =====================================================

            const existing =
              monthData.items.find(
                item =>
                  item.date === date
              );


            const imageExists =
              fs.existsSync(
                imageFile
              );


            const isComplete =
              imageExists &&
              existing &&
              existing.title &&
              existing.description &&
              existing.base64 &&
              existing.color &&
              existing.image;


            if (isComplete) {

              log(
                "Today's wallpaper is already complete."
              );


              log(
                "No update required."
              );


              return;

            }


            log(
              "Today's data is missing or incomplete."
            );


            // =====================================================
            // 3. 获取 Bing 官方 JSON
            //
            // 与原项目 request.js 完全一致。
            // =====================================================

            const apiUrl =
              "https://cn.bing.com/" +
              "HPImageArchive.aspx" +
              "?format=js" +
              "&idx=0" +
              "&n=1" +
              "&mkt=zh-CN";


            log(
              `Requesting Bing API: ${apiUrl}`
            );


            const apiBuffer =
              await requestBuffer(
                apiUrl
              );


            const bingJson =
              JSON.parse(
                apiBuffer.toString(
                  "utf8"
                )
              );


            if (
              !bingJson.images ||
              !bingJson.images[0]
            ) {

              throw new Error(
                "Bing API returned no image."
              );

            }


            const bing =
              bingJson.images[0];


            log(
              `Bing title: ${
                bing.title || ""
              }`
            );


            log(
              `Bing copyright: ${
                bing.copyright || ""
              }`
            );


            // =====================================================
            // 4. 生成图片 URL
            // =====================================================

            let defaultImageUrl =
              "https://cn.bing.com" +
              bing.url;


            let uhdImageUrl =
              "https://cn.bing.com" +
              bing.urlbase +
              "_UHD.jpg";


            log(
              `UHD URL: ${uhdImageUrl}`
            );


            // =====================================================
            // 5. 优先下载 UHD
            //
            // 如果 UHD 失败，自动使用 Bing API
            // 返回的默认高清图。
            // =====================================================

            let imageBuffer;

            let actualImageUrl;


            try {

              imageBuffer =
                await downloadImage(
                  uhdImageUrl
                );


              actualImageUrl =
                uhdImageUrl;


              log(
                "UHD image downloaded successfully."
              );


            } catch (error) {

              log(
                `UHD download failed: ${error.message}`
              );


              log(
                "Falling back to Bing default image..."
              );


              imageBuffer =
                await downloadImage(
                  defaultImageUrl
                );


              actualImageUrl =
                defaultImageUrl;


              log(
                "Default image downloaded successfully."
              );

            }


            // =====================================================
            // 6. 检查图片
            // =====================================================

            const image =
              await Jimp.read(
                imageBuffer
              );


            log(
              `Image size: ${
                image.bitmap.width
              }x${
                image.bitmap.height
              }`
            );


            if (
              image.bitmap.width < 100 ||
              image.bitmap.height < 100
            ) {

              throw new Error(
                "Downloaded image dimensions are invalid."
              );

            }


            // =====================================================
            // 7. 创建目录
            // =====================================================

            fs.mkdirSync(
              imageDir,
              {
                recursive: true
              }
            );


            fs.mkdirSync(
              yearDir,
              {
                recursive: true
              }
            );


            // =====================================================
            // 8. 保存高清图片
            // =====================================================

            log(
              "Saving HD image..."
            );


            await image.writeAsync(
              imageFile
            );


            // =====================================================
            // 9. Base64
            // =====================================================

            const base64 =
              await getBase64(
                imageBuffer
              );


            log(
              `Base64 generated: ${
                base64.length
              } characters`
            );


            // =====================================================
            // 10. 主色调
            // =====================================================

            const color =
              await getMainColors(
                imageBuffer
              );


            log(
              `Color palette: ${
                JSON.stringify(
                  color
                )
              }`
            );


            // =====================================================
            // 11. 构建图片地址
            //
            // 这里使用 raw.githubusercontent.com
            // 让 A 仓库直接读取。
            // =====================================================

            const rawBase =
              "https://raw.githubusercontent.com/" +
              "chendada00/bing-data/main";


            const imageUrl =
              `${rawBase}/images/` +
              `${year}/${month}/${date}.jpg`;


            // =====================================================
            // 12. 构建 JSON
            //
            // 不人为制造 subtitle。
            //
            // title:
            //   Bing 官方 title
            //
            // description:
            //   Bing 官方 copyright
            //
            // copyright:
            //   同样保留原始版权信息
            // =====================================================

            const item = {

              // 日期
              date,

              // Bing 官方标题
              title:
                bing.title || "",

              // Bing 官方 copyright
              //
              // 当前作为描述使用。
              description:
                bing.copyright || "",

              // 原始版权信息
              copyright:
                bing.copyright || "",

              // Bing 搜索详情地址
              copyrightLink:
                bing.copyrightlink || null,

              // 高清图片
              image:
                imageUrl,

              // 实际下载地址
              sourceImage:
                actualImageUrl,

              // 16x9 Base64
              base64,

              // node-vibrant 调色板
              color,

              // 图片尺寸
              width:
                image.bitmap.width,

              height:
                image.bitmap.height,

              // Bing 内部标识
              id:
                bing.hsh || null,

              // Bing 数据
              startDate:
                bing.startdate || null,

              fullStartDate:
                bing.fullstartdate || null,

              endDate:
                bing.enddate || null
            };


            // =====================================================
            // 13. 更新当天记录
            // =====================================================

            const index =
              monthData.items.findIndex(
                oldItem =>
                  oldItem.date === date
              );


            if (index >= 0) {

              monthData.items[index] =
                item;

            } else {

              monthData.items.push(
                item
              );

            }


            // =====================================================
            // 14. 按日期排序
            // =====================================================

            monthData.items.sort(
              (a, b) =>
                a.date.localeCompare(
                  b.date
                )
            );


            monthData.updatedAt =
              new Date().toISOString();


            // =====================================================
            // 15. 保存 JSON
            // =====================================================

            fs.writeFileSync(

              jsonFile,

              JSON.stringify(
                monthData,
                null,
                2
              ) + "\n",

              "utf8"

            );


            // =====================================================
            // 16. 最终完整性检查
            // =====================================================

            if (
              !fs.existsSync(
                imageFile
              )
            ) {

              throw new Error(
                "Final check failed: image does not exist."
              );

            }


            const finalJson =
              JSON.parse(
                fs.readFileSync(
                  jsonFile,
                  "utf8"
                )
              );


            const finalItem =
              finalJson.items.find(
                item =>
                  item.date === date
              );


            if (
              !finalItem
            ) {

              throw new Error(
                "Final check failed: JSON item missing."
              );

            }


            if (
              !finalItem.base64
            ) {

              throw new Error(
                "Final check failed: Base64 missing."
              );

            }


            if (
              !finalItem.color ||
              Object.keys(
                finalItem.color
              ).length === 0
            ) {

              throw new Error(
                "Final check failed: color missing."
              );

            }


            if (
              !finalItem.image
            ) {

              throw new Error(
                "Final check failed: image URL missing."
              );

            }


            log(
              "========================================"
            );


            log(
              "Bing wallpaper update SUCCESS."
            );


            log(
              `Date: ${date}`
            );


            log(
              `Image: ${imageFile}`
            );


            log(
              `JSON: ${jsonFile}`
            );


            log(
              `Title: ${item.title}`
            );


            log(
              `Description: ${item.description}`
            );


            log(
              `Color: ${
                JSON.stringify(
                  item.color
                )
              }`
            );


            log(
              "========================================"

            );

          }


          // ========================================================
          // 启动
          // ========================================================

          main()
            .catch(error => {

              console.error(
                "========================================"
              );


              console.error(
                "Bing wallpaper update FAILED"
              );


              console.error(
                error
              );


              console.error(
                "========================================"
              );


              process.exit(1);

            });

          NODE


      # ============================================================
      # 5. 提交
      # ============================================================

      - name: Commit changes
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            images \
            data


          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi


          git commit \
            -m "chore: update Bing wallpaper"


          git push
