name: Import Bing Wallpaper History

on:
  workflow_dispatch:
    inputs:
      days:
        description: "导入最近多少天的历史壁纸"
        required: true
        default: "5"
        type: string

permissions:
  contents: write

jobs:
  import-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --no-save \
            jimp@0.16.1 \
            node-vibrant@3.2.1-alpha.1

      - name: Import history
        env:
          DAYS: ${{ github.event.inputs.days }}
        run: |
          echo "开始导入最近 ${DAYS} 天的 Bing 壁纸历史数据"
          node scripts/import-history.js

      - name: Check changes
        run: |
          echo "===== Git Changes ====="
          git status --short

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data images preview

          if git diff --cached --quiet; then
            echo "没有新的数据需要提交"
            exit 0
          fi

          git commit -m "chore: import Bing wallpaper history"

      - name: Push changes
        run: |
          git push